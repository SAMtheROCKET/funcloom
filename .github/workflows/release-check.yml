name: Release check
# Builds the wheel and sdist once, then installs and verifies the identical
# files on Linux, Windows and macOS with scripts/release_check.py. Nothing
# is uploaded to any package index; the files are kept as run artifacts.
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - run: python -m build --outdir dist
      - run: sha256sum dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: funcloom-dist
          path: dist/
  verify:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.12', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: funcloom-dist
          path: built
      - run: python -m pip install build "setuptools>=77.0.3" twine
      - run: python scripts/release_check.py --artifacts built --output release-check
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: funcloom-release-check-${{ matrix.os }}-${{ matrix.python }}
          path: release-check/
