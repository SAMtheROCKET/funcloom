# Illustrative meanings explicitly supplied by a user, not inferred by FuncLoom.
[snippet]
naming_mode = "domain"
project_context = "A user-defined shipment calculation."
summary = "Calculate shipment mass and an adjusted result."
function_name = "calculate_shipment_mass_tuple"

[names]
b = "unit_mass"
c = "item_count"
a = "shipment_mass"
